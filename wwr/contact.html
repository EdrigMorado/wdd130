<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Rapid Rush Rafting. Contact us for general inquiries, reservation questions, or website suggestions.">
    <meta name="author" content="Edgar Garcia Morado">
    <title>Contact Us | Rapid Rush Rafting</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.jpg" alt="Rapid Rush Rafting logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="company-info">
            <h1>Rapid Rush Rafting</h1>
            <p>
                123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@rapidrushrafting.com
            </p>
        </section>

        <div class="contact-layout">
            
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3113.136456382101!2d-120.93783452443419!3d38.82277664391629!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x809a050666277377%3A0xf2ac07d60a223526!2sSierra%20Whitewater%20-%20American%20River%20Rafting%20near%20Sacramento!5e0!3m2!1ses-419!2s!4v1712419515033!5m2!1ses-419!2s"></iframe>
            </div>

            <form action="#" method="get" class="contact-form">
                
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Placeholder" required>
                </div>

                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Placeholder" required>
                </div>

                <div class="form-row">
                    <p class="label-text">Message Purpose</p>
                    <div class="radio-options">
                        <label for="general"><input type="radio" id="general" name="purpose" value="general" checked> General Inquiry</label>
                        <label for="reservation"><input type="radio" id="reservation" name="purpose" value="reservation"> Reservation Question</label>
                        <label for="suggestion"><input type="radio" id="suggestion" name="purpose" value="suggestion"> Website Suggestion</label>
                    </div>
                </div>

                <div class="form-row align-top">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here" required></textarea>
                </div>

                <div class="form-row full-width">
                    <label for="newsletter" class="checkbox-label">
                        <input type="checkbox" id="newsletter" name="newsletter" value="subscribe"> Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <div class="form-row full-width">
                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </div>

            </form>

        </div>

        <section class="employee-section">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.webp" alt="Employee Profile 1">
                    <figcaption>Mike - Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.webp" alt="Employee Profile 2">
                    <figcaption>John - Operations Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.webp" alt="Employee Profile 3">
                    <figcaption>Sarah - Safety Specialist</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rapid Rush Rafting | Edgar Garcia Morado</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>

</body>
</html>
